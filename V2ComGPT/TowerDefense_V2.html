<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense - Protótipo V2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: min(96vw, 1000px);
            aspect-ratio: 4 / 3;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #2b2b2b;
        }

        #ui-overlay {
            position: absolute;
            inset: 10px 10px auto 10px;
            pointer-events: none;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hud-item {
            width: fit-content;
            background: rgba(0, 0, 0, 0.68);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .control-btn {
            border: 1px solid #777;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            background: rgba(0, 0, 0, 0.72);
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .control-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.15);
        }

        .control-btn.active {
            border-color: #ffd700;
            box-shadow: 0 0 0 1px #ffd700;
        }

        #game-hint {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.68);
            border: 1px solid #444;
            border-radius: 5px;
            padding: 7px 12px;
            font-size: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.86);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 20;
        }

        #game-over-screen h1 {
            color: #ff4444;
            font-size: 36px;
            text-transform: uppercase;
            text-align: center;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #restart-btn:hover {
            background: #45a049;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="ui-overlay">
            <div class="hud-item" style="color: #ffd700;">Moedas: <span id="coin-count">0</span></div>
            <div class="hud-item" style="color: #ff4444;">Vida da Base: <span id="base-hp">100 / 100</span></div>
            <div class="hud-item" style="color: #4da6ff;">Nível do Jogador: <span id="player-level">1</span></div>
            <div class="hud-item" style="color: #8cff8c;">Onda: <span id="wave-count">1</span></div>
        </div>

        <div id="controls">
            <button id="accelerator-btn" class="control-btn" type="button">Acelerador: 1X</button>
            <button id="player-v2-btn" class="control-btn" type="button">Player V2 — 60G</button>
        </div>

        <div id="game-hint">
            WASD / Setas = mover • Encoste no slot = construir/melhorar torre • P = Player V2 • Espaço = 2X
        </div>

        <div id="game-over-screen">
            <h1>Sua Base Foi Destruída!</h1>
            <button id="restart-btn" type="button">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const coinCountEl = document.getElementById('coin-count');
        const baseHpEl = document.getElementById('base-hp');
        const playerLevelEl = document.getElementById('player-level');
        const waveCountEl = document.getElementById('wave-count');
        const gameOverScreen = document.getElementById('game-over-screen');
        const acceleratorBtn = document.getElementById('accelerator-btn');
        const playerV2Btn = document.getElementById('player-v2-btn');
        const restartBtn = document.getElementById('restart-btn');

        // =========================
        // Configuração de balanceamento
        // =========================
        const CONFIG = {
            STARTING_COINS: 60,
            TURRET_BUILD_COST: 30,
            TURRET_V2_COST: 60,      // 2x o custo inicial da torre
            PLAYER_V2_COST: 60,      // 2x o custo inicial da torre
            MAX_TOWER_LEVEL: 5,
            GAME_SPEEDS: [1, 2]
        };

        // =========================
        // Estado do jogo
        // =========================
        let gameOver = false;
        let coins = CONFIG.STARTING_COINS;
        let keys = {};
        let wave = 1;
        let spawnElapsed = 0;
        let waveElapsed = 0;
        let lastFrameTime = performance.now();
        let gameSpeedIndex = 0;

        const getGameSpeed = () => CONFIG.GAME_SPEEDS[gameSpeedIndex];

        const path = [
            { x: 0, y: 100 },
            { x: 650, y: 100 },
            { x: 650, y: 350 },
            { x: 150, y: 350 },
            { x: 150, y: 550 },
            { x: 750, y: 550 }
        ];

        // =========================
        // Base
        // =========================
        class Base {
            constructor() {
                this.x = 720;
                this.y = 510;
                this.width = 60;
                this.height = 80;
                this.maxHp = 100;
                this.hp = this.maxHp;
                this.level = 1;
                this.upgradeCost = 100;
            }

            draw() {
                ctx.save();

                // Corpo
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Topo / defesa
                ctx.fillStyle = '#992222';
                ctx.fillRect(this.x + 8, this.y - 8, this.width - 16, 8);

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);

                // Barra de vida
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x, this.y - 18, this.width, 8);

                ctx.fillStyle = '#00ff00';
                ctx.fillRect(
                    this.x,
                    this.y - 18,
                    (this.hp / this.maxHp) * this.width,
                    8
                );

                ctx.restore();
            }

            upgrade() {
                this.level++;
                this.maxHp += 50;
                this.hp = this.maxHp;
                this.upgradeCost = Math.floor(this.upgradeCost * 1.5);
            }
        }

        // =========================
        // Player
        // V1 = sprite circular
        // V2 = sprite de combate com núcleo e "asas"
        // =========================
        class Player {
            constructor() {
                this.x = 400;
                this.y = 250;
                this.radius = 15;
                this.speed = 210; // pixels / segundo
                this.fireCooldown = 0;
                this.fireRate = 20 / 60; // aproximadamente 20 frames do protótipo original
                this.damage = 15;
                this.range = 180;
                this.level = 1;
            }

            move(dt) {
                const movement = this.speed * dt;

                if ((keys['w'] || keys['W'] || keys['ArrowUp']) && this.y - this.radius > 0) {
                    this.y -= movement;
                }

                if ((keys['s'] || keys['S'] || keys['ArrowDown']) && this.y + this.radius < canvas.height) {
                    this.y += movement;
                }

                if ((keys['a'] || keys['A'] || keys['ArrowLeft']) && this.x - this.radius > 0) {
                    this.x -= movement;
                }

                if ((keys['d'] || keys['D'] || keys['ArrowRight']) && this.x + this.radius < canvas.width) {
                    this.x += movement;
                }
            }

            upgradeToV2() {
                if (this.level >= 2 || coins < CONFIG.PLAYER_V2_COST) return false;

                coins -= CONFIG.PLAYER_V2_COST;
                this.level = 2;

                // Melhoria de combate da V2
                this.damage = 24;
                this.range = 210;
                this.speed = 235;
                this.fireRate = 14 / 60;

                return true;
            }

            update(dt) {
                this.move(dt);

                this.fireCooldown -= dt;

                if (this.fireCooldown <= 0) {
                    const target = getClosestEnemy(this.x, this.y, this.range);

                    if (target) {
                        projectiles.push(
                            new Projectile(
                                this.x,
                                this.y,
                                target,
                                this.damage,
                                '#4da6ff',
                                430
                            )
                        );

                        this.fireCooldown = this.fireRate;
                    } else {
                        this.fireCooldown = 0;
                    }
                }
            }

            draw() {
                ctx.save();

                // Área de alcance
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
                ctx.strokeStyle = this.level >= 2
                    ? 'rgba(0, 255, 170, 0.20)'
                    : 'rgba(77, 166, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();

                if (this.level === 1) {
                    // Sprite básico V1
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#4da6ff';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(this.x - 5, this.y - 3, 2, 0, Math.PI * 2);
                    ctx.arc(this.x + 5, this.y - 3, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Sprite básico V2
                    ctx.translate(this.x, this.y);

                    // "Asas"
                    ctx.fillStyle = '#00c98b';
                    ctx.beginPath();
                    ctx.moveTo(-20, 0);
                    ctx.lineTo(-8, -8);
                    ctx.lineTo(-8, 8);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(20, 0);
                    ctx.lineTo(8, -8);
                    ctx.lineTo(8, 8);
                    ctx.closePath();
                    ctx.fill();

                    // Núcleo
                    ctx.beginPath();
                    ctx.moveTo(0, -18);
                    ctx.lineTo(16, 0);
                    ctx.lineTo(0, 18);
                    ctx.lineTo(-16, 0);
                    ctx.closePath();

                    ctx.fillStyle = '#16e3a0';
                    ctx.fill();

                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // =========================
        // Inimigo
        // =========================
        class Enemy {
            constructor(type = 'basic') {
                this.pathIndex = 0;
                this.x = path[0].x;
                this.y = path[0].y;

                if (type === 'boss') {
                    this.radius = 22;
                    this.hp = 300;
                    this.maxHp = 300;
                    this.speed = 48;
                    this.reward = 50;
                    this.color = '#800080';
                    this.damage = 30;
                } else {
                    this.radius = 12;
                    this.hp = 40;
                    this.maxHp = 40;
                    this.speed = 108;
                    this.reward = 10;
                    this.color = '#ffaa00';
                    this.damage = 10;
                }
            }

            update(dt) {
                const target = path[this.pathIndex + 1];
                if (!target) return;

                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy);
                const step = this.speed * dt;

                if (dist <= step) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;

                    if (this.pathIndex >= path.length - 1) {
                        base.hp -= this.damage;

                        if (base.hp <= 0) {
                            base.hp = 0;
                            gameOver = true;
                        }

                        this.hp = 0;
                    }
                } else {
                    this.x += (dx / dist) * step;
                    this.y += (dy / dist) * step;
                }
            }

            draw() {
                ctx.save();

                // Sprite básico do inimigo
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Barra de vida
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 15, this.y - this.radius - 9, 30, 4);

                ctx.fillStyle = '#ff0000';
                ctx.fillRect(
                    this.x - 15,
                    this.y - this.radius - 9,
                    (this.hp / this.maxHp) * 30,
                    4
                );

                ctx.restore();
            }
        }

        // =========================
        // Projétil
        // =========================
        class Projectile {
            constructor(x, y, target, damage, color = '#ffff00', speed = 420) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.damage = damage;
                this.color = color;
                this.speed = speed;
                this.radius = 4;
                this.active = true;
            }

            update(dt) {
                if (!this.target || this.target.hp <= 0) {
                    this.active = false;
                    return;
                }

                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.hypot(dx, dy);
                const step = this.speed * dt;

                if (dist <= step) {
                    this.target.hp -= this.damage;

                    if (this.target.hp <= 0) {
                        coins += this.target.reward;
                    }

                    this.active = false;
                } else {
                    this.x += (dx / dist) * step;
                    this.y += (dy / dist) * step;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // =========================
        // Torre
        // V1 = sprite circular
        // V2 = sprite com corpo quadrado + canhão
        // =========================
        class TowerSlot {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 25;
                this.level = 0;
                this.fireCooldown = 0;
            }

            getCost() {
                if (this.level === 0) return CONFIG.TURRET_BUILD_COST;
                if (this.level === 1) return CONFIG.TURRET_V2_COST;

                // Após V2, mantém progressão normal
                return Math.floor(CONFIG.TURRET_V2_COST * Math.pow(1.6, this.level - 1));
            }

            getStats() {
                if (this.level === 1) {
                    return {
                        damage: 22,
                        range: 115,
                        fireRate: 28 / 60,
                        projectileSpeed: 500,
                        projectileColor: '#00ffff'
                    };
                }

                return {
                    damage: 10 + this.level * 12,
                    range: 100 + this.level * 15,
                    fireRate: Math.max(8 / 60, (35 - this.level * 5) / 60),
                    projectileSpeed: 540,
                    projectileColor: this.level >= 2 ? '#00ff99' : '#00ffff'
                };
            }

            update(dt) {
                if (this.level === 0) return;

                const stats = this.getStats();
                this.fireCooldown -= dt;

                if (this.fireCooldown <= 0) {
                    const target = getClosestEnemy(this.x, this.y, stats.range);

                    if (target) {
                        projectiles.push(
                            new Projectile(
                                this.x,
                                this.y,
                                target,
                                stats.damage,
                                stats.projectileColor,
                                stats.projectileSpeed
                            )
                        );

                        this.fireCooldown = stats.fireRate;
                    } else {
                        this.fireCooldown = 0;
                    }
                }
            }

            draw() {
                ctx.save();

                // Plataforma
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.level === 0
                    ? 'rgba(255,255,255,0.1)'
                    : '#444';
                ctx.fill();

                ctx.strokeStyle = this.level === 0 ? '#aaa' : '#00ffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                if (this.level > 0) {
                    if (this.level === 1) {
                        // Sprite básico V1
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 14, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffd700';
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.stroke();

                        // Canhão
                        ctx.fillStyle = '#222';
                        ctx.fillRect(this.x + 8, this.y - 3, 16, 6);
                    } else {
                        // Sprite V2+
                        ctx.translate(this.x, this.y);

                        // Corpo
                        ctx.fillStyle = this.level >= 3 ? '#3be3a2' : '#00a878';
                        ctx.fillRect(-14, -14, 28, 28);

                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-14, -14, 28, 28);

                        // Cúpula
                        ctx.beginPath();
                        ctx.arc(0, 0, 8, 0, Math.PI * 2);
                        ctx.fillStyle = '#d8fff3';
                        ctx.fill();

                        // Canhão
                        ctx.fillStyle = '#17352f';
                        ctx.fillRect(8, -3, 17, 6);
                    }

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`V${this.level}`, this.x, this.y + 4);
                } else {
                    // Custo para construir
                    ctx.fillStyle = '#ffd700';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${this.getCost()}G`, this.x, this.y + 4);
                }

                ctx.restore();
            }

            checkUpgrade(player) {
                const dist = Math.hypot(player.x - this.x, player.y - this.y);

                if (dist >= player.radius + this.radius) return;

                const cost = this.getCost();

                if (this.level < CONFIG.MAX_TOWER_LEVEL && coins >= cost) {
                    coins -= cost;
                    this.level++;

                    // Evita gasto repetido por frame quando o jogador continua encostado.
                    player.x += player.x < this.x ? -2 : 2;
                }
            }
        }

        let base;
        let player;
        let enemies;
        let projectiles;
        let towerSlots;

        function createTowerSlots() {
            return [
                new TowerSlot(300, 180),
                new TowerSlot(500, 180),
                new TowerSlot(350, 290),
                new TowerSlot(500, 430),
                new TowerSlot(300, 480)
            ];
        }

        function resetGameState() {
            gameOver = false;
            coins = CONFIG.STARTING_COINS;
            wave = 1;
            spawnElapsed = 0;
            waveElapsed = 0;
            enemies = [];
            projectiles = [];
            base = new Base();
            player = new Player();
            towerSlots = createTowerSlots();
            gameOverScreen.style.display = 'none';
        }

        // =========================
        // Busca de alvo
        // =========================
        function getClosestEnemy(x, y, range) {
            let closest = null;
            let minDist = range;

            for (const enemy of enemies) {
                if (enemy.hp <= 0) continue;

                const dist = Math.hypot(enemy.x - x, enemy.y - y);

                if (dist < minDist) {
                    minDist = dist;
                    closest = enemy;
                }
            }

            return closest;
        }

        // =========================
        // Eventos
        // =========================
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.code === 'Space') {
                e.preventDefault();
                toggleGameSpeed();
            }

            if (e.key === 'p' || e.key === 'P') {
                player.upgradeToV2();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        acceleratorBtn.addEventListener('click', toggleGameSpeed);

        playerV2Btn.addEventListener('click', () => {
            player.upgradeToV2();
        });

        restartBtn.addEventListener('click', restartGame);

        function toggleGameSpeed() {
            if (gameOver) return;

            gameSpeedIndex = gameSpeedIndex === 0 ? 1 : 0;
            updateSpeedButton();
        }

        function updateSpeedButton() {
            const speed = getGameSpeed();
            acceleratorBtn.textContent = `Acelerador: ${speed}X`;
            acceleratorBtn.classList.toggle('active', speed === 2);
        }

        // =========================
        // Renderização
        // =========================
        function drawPath() {
            ctx.save();

            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);

            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }

            ctx.strokeStyle = '#3a3a3a';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Linha central decorativa
            ctx.strokeStyle = '#505050';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.stroke();

            ctx.restore();
        }

        // =========================
        // Atualização do jogo
        // dt já chega multiplicado pela velocidade do jogo
        // =========================
        function update(dt) {
            if (gameOver) {
                gameOverScreen.style.display = 'flex';
                return;
            }

            // Spawn progressivo
            spawnElapsed += dt;
            waveElapsed += dt;

            const spawnInterval = Math.max(0.5, 2 - wave * 0.08);

            if (spawnElapsed >= spawnInterval) {
                spawnElapsed = 0;

                const isBoss = wave > 1 && Math.floor(wave % 5) === 0 && enemies.length === 0;
                enemies.push(new Enemy(isBoss ? 'boss' : 'basic'));
            }

            if (waveElapsed >= 16.67) {
                waveElapsed = 0;
                wave++;
            }

            player.update(dt);

            for (const slot of towerSlots) {
                slot.update(dt);
                slot.checkUpgrade(player);
            }

            for (const projectile of projectiles) {
                projectile.update(dt);
            }

            projectiles = projectiles.filter(p => p.active);

            for (const enemy of enemies) {
                enemy.update(dt);
            }

            enemies = enemies.filter(e => e.hp > 0);

            coinCountEl.textContent = coins;
            baseHpEl.textContent = `${base.hp} / ${base.maxHp}`;
            playerLevelEl.textContent = player.level;
            waveCountEl.textContent = wave;

            playerV2Btn.textContent = player.level >= 2
                ? 'Player V2 — ATIVO'
                : `Player V2 — ${CONFIG.PLAYER_V2_COST}G`;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPath();
            base.draw();

            for (const slot of towerSlots) {
                slot.draw();
            }

            player.draw();

            for (const enemy of enemies) {
                enemy.draw();
            }

            for (const projectile of projectiles) {
                projectile.draw();
            }
        }

        // =========================
        // Loop com aceleração real
        // =========================
        function gameLoop(currentTime) {
            const realDt = Math.min((currentTime - lastFrameTime) / 1000, 0.05);
            lastFrameTime = currentTime;

            const scaledDt = realDt * getGameSpeed();

            update(scaledDt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            gameSpeedIndex = 0;
            updateSpeedButton();
            resetGameState();
            lastFrameTime = performance.now();
        }

        // =========================
        // Início
        // =========================
        resetGameState();
        updateSpeedButton();
        requestAnimationFrame(gameLoop);
    </script>
</body>
